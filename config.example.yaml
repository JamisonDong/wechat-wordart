# ── 输入 ──────────────────────────────────────────────
input:
  path: "data/chat.txt"      # 聊天记录文件路径
  format: "txt"              # txt | csv
  encoding: "utf-8"          # 文件编码，如有乱码可改 gbk / utf-8-sig

# ── 分词 ──────────────────────────────────────────────
segmenter:
  min_word_length: 2         # 最短词长（过滤单字）
  top_n: 200                 # 保留频率前 N 的词
  extra_stopwords: []        # 额外停用词列表，如 ["嗯", "哦"]
  user_dict: null            # 自定义词典路径，如 "data/mydict.txt"

# ── 情感筛选（可选，需本地 Ollama） ──────────────────────
sentiment:
  enabled: false
  provider: "ollama"
  model: "qwen2:7b"          # 推荐轻量模型：qwen2:1.5b / phi3
  base_url: "http://localhost:11434"
  filter_negative: true      # 过滤负面词汇
  batch_size: 50             # 每批发送词数量

# ── 词表输出 ──────────────────────────────────────────
wordlist:
  output_path: "output/wordlist.json"
  top_n: 100                 # 最终词表保留词数

# ── SVG 渲染 ──────────────────────────────────────────
renderer:
  output_path: "output/wordart.svg"
  width: 800
  height: 600
  max_font_size: 80
  min_font_size: 12
  font_family: "PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
  # 6 色方案，可自定义（支持 hex / CSS 颜色名）
  colors:
    - "#2C3E50"
    - "#E74C3C"
    - "#3498DB"
    - "#27AE60"
    - "#F39C12"
    - "#9B59B6"
  background: "#FAFAFA"

# ── E-ink 渲染（供 ESP32 墨水屏，1-bit BMP/PNG） ───────────
eink:
  enabled: true
  output_path: "output/eink.bmp"  # 同时会生成同名 .png 预览图
  width: 800                      # 常见墨水屏：800x480(7.5寸) / 400x300(4.2寸) / 640x384(7.5寸V2) / 960x640(10寸)
  height: 480
  max_font_size: 72               # 墨水屏建议 60~80，字太小看不清
  min_font_size: 14
  margin: 8                       # 屏幕边距
  padding: 4                      # 词间距
  rotate: false                   # 墨水屏建议 false（易读），true 则高频词轻微旋转
  # width/height 改后需同步改 output 尺寸，HTTP 接口也支持 ?w=800&h=480 动态渲染

# ── HTTP 服务（供树莓派/ESP32拉取） ─────────────────────
server:
  host: "0.0.0.0"
  port: 8765
  output_dir: "output"
